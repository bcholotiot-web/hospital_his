spring.application.name=hospital-his-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_his
spring.datasource.username=postgres
spring.datasource.password=1775

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Servidor
server.port=8080

jwt.secret=HospitalHISSecretKey2026HospitalHISSecretKey2026
jwt.expiration=86400000
#-------------------------------------------------------------------------------------------------------------------------
#monto configurable de desarrollo.
payments.consultation-amount=250.00
payments.currency=GTQ   
#-------------------------------------------------------------------------------------------------------------------------
#Configuración total de intentos x login y tiempo de bloqueo.
security.login.max-attempts=5
security.login.lock-duration-minutes=15
#-------------------------------------------------------------------------------------------------------------------------
# Configuración SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración del hospital
hospital.mail.from=${MAIL_USERNAME}
hospital.mail.name=Hospital HIS
#-------------------------------------------------------------------------------------------------------------------------
# RN-CU03-04: documentos de cita
spring.servlet.multipart.enabled=true

# El documento permitido es de 2 MB.
spring.servlet.multipart.max-file-size=2MB

# El multipart también contiene el JSON de la cita.
spring.servlet.multipart.max-request-size=3MB
